<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>达人视频看板</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-2: #f5f5f7; --text: #1d1d1f; --text-2: #6e6e73; --muted: #86868b;
  --line: #e8e8ed; --grid: #f0f0f2; --axis: #d2d2d7; --hover: #f5f5f7;
  --accent: #0071e3; --accent-soft: rgba(0,113,227,.10); --prev: #c7c7cc;
  --up: #1a7f37; --down: #d70015; --new: #0071e3; --c2: #e07a10;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1c1e; --bg-2: #2c2c2e; --text: #f5f5f7; --text-2: #a1a1a6; --muted: #8e8e93;
  --line: #38383a; --grid: #2c2c2e; --axis: #48484a; --hover: #2c2c2e;
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,.16); --prev: #545458;
  --up: #30d158; --down: #ff453a; --new: #0a84ff; --c2: #ff9f0a;
}
.lock { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 18px 0 6px; font-size: 13px; color: var(--text-2); }
.lock input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; font-size: 13px; width: 220px; }
.lock .err { color: var(--down); }
body.locked #srcbar, body.locked #modes, body.locked #range, body.locked #updated, body.locked #custom { display: none !important; }
.lock[hidden], #dlbar[hidden], #trendBody[hidden], section[hidden], .size[hidden] { display: none !important; }
h3.sub { font-size: 15px; font-weight: 600; margin: 28px 0 8px; }
.spark { display: block; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, th:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }
@media (max-width: 600px) { .wrap { padding: 16px 16px 40px; } }

/* 顶部 */
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.shop { font-size: 13px; color: var(--text-2); }
h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.14; font-weight: 600; letter-spacing: -.015em; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--text); }
.seg button.on { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 500; }
:root[data-theme="dark"] .seg button.on { background: #636366; }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 6px; }
.link:disabled { color: var(--muted); cursor: default; }
.sub-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--text-2); }
.sub-bar label { display: inline-flex; gap: 6px; align-items: center; }
select, input[type=date] { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 6px; font-size: 13px; max-width: 240px; }
.custom { display: none; gap: 6px; align-items: center; }
.custom.show { display: inline-flex; }
.primary { border: 0; background: var(--accent); color: #fff; border-radius: 980px; padding: 4px 14px; font-size: 13px; cursor: pointer; }
.size { display: inline-flex; gap: 2px; }
.size button { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; }
.size button.on { color: var(--accent); }
.msg { margin-top: 20px; padding: 12px 0; color: var(--text-2); font-size: 13px; }
.msg.err { color: var(--down); }
.progress { height: 2px; background: var(--line); margin-top: 16px; display: none; overflow: hidden; }
.progress.show { display: block; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#out.loading { opacity: .45; transition: opacity .15s; }

/* 指标标签(点选切换下方大图) */
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 28px; border-bottom: 1px solid var(--line); }
@media (max-width: 760px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.metric { text-align: left; border: 0; background: none; padding: 10px 16px 14px 0; cursor: pointer; position: relative; min-width: 0; }
.metric .k { font-size: 13px; color: var(--text-2); }
.metric .v { font-size: 28px; font-weight: 600; letter-spacing: -.015em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric .d { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric::after { content: ""; position: absolute; left: 0; right: 16px; bottom: -1px; height: 2px; background: transparent; }
.metric.on::after { background: var(--accent); }
.metric:hover .v { color: var(--accent); }
.up { color: var(--up); } .down { color: var(--down); }
.chart-main { margin-top: 18px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; margin-right: 6px; vertical-align: 3px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

/* 洞察 */
.insights { margin: 22px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.insights li { background: var(--bg-2); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--text-2); line-height: 1.55; }
.insights b { color: var(--text); font-weight: 600; }

/* 分区 */
section { margin-top: 40px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.sec-h h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.sec-h p { margin: 0; font-size: 12px; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 36px; padding: 14px 0 4px; }
.stat .k { font-size: 12px; color: var(--text-2); }
.stat .v { font-size: 20px; font-weight: 600; margin-top: 1px; }
.stat .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; }

/* 表格 */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.tbl th.s { cursor: pointer; }
.tbl th.s:hover { color: var(--text); }
.tbl th.sorted { color: var(--text); }
.tbl th.sorted::after { content: " ↓"; }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:hover td { background: var(--hover); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .rk { color: var(--muted); width: 28px; font-variant-numeric: tabular-nums; }
.tbl .who { min-width: 0; }
.tbl .who a { color: var(--text); text-decoration: none; font-weight: 500; }
.tbl .who a:hover { color: var(--accent); }
.tbl .meta { font-size: 12px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; color: var(--new); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.badge.paid { color: var(--text-2); background: var(--bg-2); border: 1px solid var(--line); }
.seg[hidden] { display: none; }
.bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bar span.track { width: 64px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: none; }
.bar span.track i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.more { display: block; margin: 10px auto 0; }
.scroll { overflow-x: auto; }
@media (max-width: 760px) { .hide-sm { display: none; } }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

/* 提示框 */
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--bg); color: var(--text); border-radius: 10px; padding: 8px 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.08); font-size: 12px; min-width: 140px; display: none; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.tip .r span { color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.tip .r i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
.tip .r b { font-weight: 600; font-variant-numeric: tabular-nums; }

body.dash .size { display: none; }
body.dash-view #srcbar { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="shop" id="shop">TikTok Shop</div><h1>达人与视频</h1></div>
    <div class="tools">
      <div class="seg" id="pills" role="group" aria-label="时间段">
        <button data-p="lastweek">上周</button><button data-p="thisweek">本周</button><button data-p="7">7 天</button><button data-p="28">28 天</button><button data-p="lastmonth">上月</button><button data-p="custom">自定义</button>
      </div>
      <button class="link" id="reload" title="重新读取数据(数据由导出助手写入 GitHub)">刷新</button><button class="link" id="lockBtn" hidden title="清除本机记住的团队密码">锁定</button>
    </div>
  </header>
  <div class="sub-bar">
    <span class="seg" id="modes" role="group" aria-label="达人类型" hidden><button data-mode="all">全部</button><button data-mode="organic">纯佣</button><button data-mode="paid">付费</button></span>
    <span id="range"></span>
    <span id="updated" style="color:var(--muted)"></span>
    <span class="custom" id="custom"><input type="date" id="cs" aria-label="开始日期"> – <input type="date" id="ce" aria-label="结束日期"> <button class="link" id="apply">应用</button></span>
    <span id="srcbar" style="display:inline-flex;gap:12px;flex-wrap:wrap;align-items:center">
      <label>视频 <select id="srcVideo"></select></label>
      <label>订单 <select id="srcOrder"></select></label>
      <button id="saveCfg" class="primary" hidden>保存到仪表盘</button>
    </span>
    <span id="dlbar" hidden style="display:inline-flex;gap:4px;align-items:center"><select id="dlSet" aria-label="下载哪类数据"></select><button class="link" id="dlBtn" title="按当前店铺和日期解密并下载 CSV">下载 CSV</button></span>
    <span class="size" id="size" title="调整侧边栏大小(飞书不一定支持)"><button data-s="small">小</button><button data-s="medium">中</button><button data-s="large">大</button></span>
  </div>
  <div class="msg" id="cfgHint" hidden>选好店铺和默认时间段后点「保存到仪表盘」,之后可以在仪表盘里全屏查看。</div>
  <div class="progress" id="progress"><i></i></div>
  <div id="msg" class="msg">正在启动…</div>
  <div class="lock" id="lock" hidden>
    <span>数据存放在 GitHub,已加密。输入团队密码查看(本机会记住):</span>
    <input type="password" id="pw" autocomplete="off" aria-label="团队密码"> <button class="primary" id="unlock">解锁</button> <span class="err" id="lockMsg"></span>
  </div>

  <div id="out" hidden>
    <div class="metrics" id="metrics" role="tablist"></div>
    <div class="chart-main"><div class="legend" id="legend"></div><div class="chart" id="mainChart"></div></div>
    <ul class="insights" id="insights"></ul>

    <section>
      <div class="sec-h"><h2>达人</h2><p>按视频发布日期统计 · 点表头排序 · 「新」= 上一期没有发过视频</p></div>
      <div class="scroll" id="creators"></div>
    </section>

    <section>
      <div class="sec-h"><h2>视频</h2><p>播放、订单、GMV 为导出时的累计值</p></div>
      <div class="scroll" id="videos"></div>
    </section>

    <section id="trendSec" hidden>
      <div class="sec-h"><h2>视频走势</h2><p><span id="trendNote"></span></p></div>
      <div id="trendBody">
        <div class="metrics" id="trendMetrics" role="tablist" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px"></div>
        <div class="chart-main"><div class="legend" id="trendLegend"></div><div class="chart" id="trendChart"></div></div>
        <ul class="insights" id="trendInsights"></ul>
        <h3 class="sub" id="lifeTitle"></h3>
        <div class="chart" id="lifeChart"></div>
        <h3 class="sub">视频明细 <span style="font-size:12px;font-weight:400;color:var(--muted)">区间内每天的数据加总 · 点表头排序</span></h3>
        <div class="scroll" id="trendVideos"></div>
      </div>
    </section>

    <section>
      <div class="sec-h"><h2>出单情况</h2><p>视频带动的商品,以及店铺整体订单</p></div>
      <div class="stats" id="orderStats"></div>
      <div class="scroll" id="products"></div>
    </section>

    <section id="gmvSec" hidden>
      <div class="sec-h"><h2>GMV Max 广告</h2><p><span id="gmvNote"></span> · 全店广告数据,不区分付费 / 纯佣</p></div>
      <div class="metrics" id="gmvMetrics" role="tablist" style="margin-top:8px"></div>
      <div class="chart-main"><div class="legend" id="gmvLegend"></div><div class="chart" id="gmvChart"></div></div>
      <div class="stats" id="gmvStats"></div>
      <div class="scroll" id="campaigns"></div>
    </section>
  </div>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script type="module" src="app.js?v=20261110f"></script>
</body>
</html>
